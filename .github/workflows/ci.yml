name: Release website

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

concurrency:
  group: website-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Validate the release tag
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          test "$(git rev-list -n 1 "$GITHUB_REF_NAME")" = "$GITHUB_SHA"

      - name: Install and build
        run: |
          npm ci
          npm run check
          npm run build
          test -f dist/index.html
          test -f dist/pl/index.html
          test -f dist/en/index.html

      - name: Import the artifact-signing key
        env:
          RELEASE_GPG_PRIVATE_KEY: ${{ secrets.RELEASE_GPG_PRIVATE_KEY }}
        run: |
          printf '%s' "$RELEASE_GPG_PRIVATE_KEY" | gpg --batch --import

      - name: Package and sign the release
        shell: bash
        env:
          RELEASE_GPG_PASSPHRASE: ${{ secrets.RELEASE_GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          commit="$GITHUB_SHA"
          tag="$GITHUB_REF_NAME"
          release_id="${tag}-${commit:0:12}"
          archive="bearworks-${release_id}.tar.gz"
          epoch="$(git show -s --format=%ct "$commit")"

          jq -n \
            --arg site bearworks \
            --arg tag "$tag" \
            --arg commit "$commit" \
            --arg release_id "$release_id" \
            '{schema_version: 1, site: $site, tag: $tag, commit: $commit, release_id: $release_id}' \
            > dist/.release-manifest.json

          find dist -exec touch -h -d "@${epoch}" {} +
          tar --sort=name --format=posix \
            --pax-option=delete=atime,delete=ctime \
            --mtime="@${epoch}" --owner=0 --group=0 --numeric-owner \
            -C dist -cf - . | gzip -n -9 > "$archive"

          sha256sum "$archive" > SHA256SUMS
          printf '%s' "$RELEASE_GPG_PASSPHRASE" | \
            gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 \
              --detach-sign --output SHA256SUMS.gpg SHA256SUMS

          printf 'ARCHIVE=%s\n' "$archive" >> "$GITHUB_ENV"

      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "$ARCHIVE" SHA256SUMS SHA256SUMS.gpg \
            --verify-tag --generate-notes --latest
